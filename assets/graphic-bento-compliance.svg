<style>
.comp_master {
  transform-origin: 525px 203px;
  animation: comp_master_float 4.8s ease-in-out infinite;
  will-change: transform;
}
@keyframes comp_master_float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}
.comp_check {
  fill: #DEDEDE;
  will-change: fill;
}
.comp_strike {
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
  opacity: 0;
  will-change: stroke-dashoffset, opacity;
}
.comp_check_1 { animation: comp_seq_check_1 11s linear infinite; }
.comp_strike_1 { animation: comp_seq_strike_1 11s linear infinite; }
.comp_check_2 { animation: comp_seq_check_2 11s linear infinite; }
