<svg width="610" height="610" viewBox="0 0 610 610" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<style>
  .ds_stream { transform-box: fill-box; transform-origin: center; will-change: transform, opacity; }
  .ds_stream_1 { animation: ds_stream_drift 6.5s linear infinite; }
  .ds_stream_2 { animation: ds_stream_drift 8s   linear infinite -1.5s; }
  .ds_stream_3 { animation: ds_stream_drift 9.5s linear infinite -3.2s; }
  .ds_stream_4 { animation: ds_stream_drift 10.5s linear infinite -5.4s; }
  .ds_stream_5 { animation: ds_stream_drift 12s  linear infinite -7.8s; }
  @keyframes ds_stream_drift {
    0%   { transform: translateY(-240px); opacity: 0; }
    12%  { opacity: 1; }
    88%  { opacity: 1; }
    100% { transform: translateY(280px);  opacity: 0; }
  }

  .ds_shield {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: ds_shield_pulse 4.5s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes ds_shield_pulse {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-3px) scale(1.012); }
  }

  .ds_binary { animation: ds_binary_breathe 6.5s ease-in-out infinite; }
  @keyframes ds_binary_breathe {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.78; }
  }

  .ds_activity { opacity: 0; will-change: opacity; }
  .ds_activity_a { animation: ds_activity_pulse 3.6s ease-in-out infinite -0.0s; }
  .ds_activity_b { animation: ds_activity_pulse 3.2s ease-in-out infinite -0.5s; }
  .ds_activity_c { animation: ds_activity_pulse 4.2s ease-in-out infinite -1.4s; }
  .ds_activity_d { animation: ds_activity_pulse 2.8s ease-in-out infinite -1.9s; }
  .ds_activity_e { animation: ds_activity_pulse 3.9s ease-in-out infinite -0.95s; }
  .ds_activity_f { animation: ds_activity_pulse 3.5s ease-in-out infinite -2.4s; }
  .ds_activity_g { animation: ds_activity_pulse 4.4s ease-in-out infinite -0.25s; }
  .ds_activity_h { animation: ds_activity_pulse 3.0s ease-in-out infinite -2.25s; }
  .ds_activity_i { animation: ds_activity_pulse 3.8s ease-in-out infinite -1.25s; }
  @keyframes ds_activity_pulse {
    0%, 100% { opacity: 0; }
    50%      { opacity: 0.42; }
  }

  .ds_check_shine {
    transform-box: fill-box;
    transform-origin: center;
    animation: ds_check_sweep 4s ease-in-out infinite;
    will-change: transform, opacity;
  }
  @keyframes ds_check_sweep {
    0%   { transform: translateX(-220px); opacity: 0; }
    18%  { opacity: 1; }
    82%  { opacity: 1; }
    100% { transform: translateX(220px);  opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ds_stream, .ds_shield, .ds_binary,
    .ds_activity_a, .ds_activity_b, .ds_activity_c, .ds_activity_d, .ds_activity_e,
    .ds_activity_f, .ds_activity_g, .ds_activity_h, .ds_activity_i,
    .ds_check_shine { animation: none; }
    .ds_activity { opacity: 0; }
  }
</style>
