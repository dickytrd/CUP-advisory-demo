<svg width="340" height="164" viewBox="0 0 340 164" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .info_bento_floating { animation: infob_float 11s ease-in-out infinite; }
  .info_bento_highlight {
    transform-box: fill-box;
    transform-origin: 0% 50%;
    animation: infob_highlight 7s ease-in-out infinite;
  }
  .info_bento_asterisk { opacity: 0; }
  .info_bento_asterisk_1 { animation: infob_a1 7s ease-in-out infinite; }
  .info_bento_asterisk_2 { animation: infob_a2 7s ease-in-out infinite; }
  .info_bento_asterisk_3 { animation: infob_a3 7s ease-in-out infinite; }
  .info_bento_asterisk_4 { animation: infob_a4 7s ease-in-out infinite; }
  .info_bento_tile_border_1 { animation: infob_b1 7s ease-in-out infinite; }
  .info_bento_tile_border_2 { animation: infob_b2 7s ease-in-out infinite; }
  .info_bento_tile_border_3 { animation: infob_b3 7s ease-in-out infinite; }
  .info_bento_tile_border_4 { animation: infob_b4 7s ease-in-out infinite; }
  .info_bento_tile_hover { cursor: pointer; transition: filter 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  .info_bento_tile_border { transition: stroke 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  .info_bento_tile_hover:hover { filter: drop-shadow(0 2px 10px rgba(10, 53, 55, 0.18)); }
  .info_bento_tile_hover:hover .info_bento_tile_border { stroke: rgba(10, 53, 55, 0.5) !important; }
  .info_bento_label_protected { animation: infob_label_a 6s ease-in-out infinite; }
  .info_bento_label_encrypted { animation: infob_label_b 8s ease-in-out infinite -1.2s; }

  @keyframes infob_float {
    0%, 100% { transform: translate3d(0, 0, 0); }
    50% { transform: translate3d(0, -2px, 0); }
  }
  @keyframes infob_highlight {
    0%, 4% { transform: scaleX(1); opacity: 0; }
    6%, 14% { transform: scaleX(1); opacity: 1; }
    18%, 26% { transform: scaleX(1.94); opacity: 1; }
    30%, 38% { transform: scaleX(2.88); opacity: 1; }
    42%, 80% { transform: scaleX(3.82); opacity: 1; }
    92% { transform: scaleX(3.82); opacity: 0; }
    100% { transform: scaleX(1); opacity: 0; }
  }
  @keyframes infob_a1 {
    0%, 6% { opacity: 0; }
    14%, 80% { opacity: 1; }
    92%, 100% { opacity: 0; }
  }
  @keyframes infob_a2 {
    0%, 18% { opacity: 0; }
    26%, 80% { opacity: 1; }
    92%, 100% { opacity: 0; }
  }
  @keyframes infob_a3 {
    0%, 30% { opacity: 0; }
    38%, 80% { opacity: 1; }
    92%, 100% { opacity: 0; }
  }
  @keyframes infob_a4 {
    0%, 42% { opacity: 0; }
    50%, 80% { opacity: 1; }
    92%, 100% { opacity: 0; }
  }
  @keyframes infob_b1 {
    0%, 5%, 18%, 100% { stroke: #B4D8C6; }
    6%, 14% { stroke: #0A3537; }
  }
  @keyframes infob_b2 {
    0%, 16%, 30%, 100% { stroke: #B4D8C6; }
    18%, 26% { stroke: #0A3537; }
  }
  @keyframes infob_b3 {
    0%, 28%, 42%, 100% { stroke: #B4D8C6; }
    30%, 38% { stroke: #0A3537; }
  }
  @keyframes infob_b4 {
    0%, 40%, 54%, 100% { stroke: #B4D8C6; }
    42%, 50% { stroke: #0A3537; }
  }
  @keyframes infob_label_a {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  @keyframes infob_label_b {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .info_bento_floating, .info_bento_asterisk_1, .info_bento_asterisk_2,
    .info_bento_asterisk_3, .info_bento_asterisk_4,
    .info_bento_tile_border_1, .info_bento_tile_border_2,
    .info_bento_tile_border_3, .info_bento_tile_border_4,
    .info_bento_label_protected, .info_bento_label_encrypted,
    .info_bento_highlight,
    .info_bento_tile_hover, .info_bento_tile_border { animation: none !important; transition: none !important; }
    .info_bento_asterisk { opacity: 1; }
    .info_bento_highlight { transform: scaleX(3.82); opacity: 1; }
  }
</style>
